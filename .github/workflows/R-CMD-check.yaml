# R CMD check, with Python (numpy, pandas, a Jupyter kernel) and Quarto set
# up so that the Python, Jupyter and Quarto tests run instead of skipping.
# The Julia tests are skipped (WEFT_SKIP_JULIA below): Julia segfaults R on
# the runner, see finding 22 in dev/open-findings.md. One Ubuntu job on R
# release, to keep it cheap. The suite takes about 25-35 minutes.
# Based on check-standard in https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      WEFT_SKIP_JULIA: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # jupyter_client and ipykernel let the Jupyter tests run, with a python3
      # kernel registered for the runner's user. Quarto's own jupyter.py also
      # needs pyyaml, nbformat and nbclient: without pyyaml every
      # `quarto render` of a notebook died with "No module named 'yaml'".
      - name: Install numpy, pandas and a Jupyter kernel
        run: |
          python -m pip install numpy pandas jupyter_client ipykernel pyyaml nbformat nbclient
          python -m ipykernel install --user

      - name: Install udunits
        run: sudo apt-get update && sudo apt-get install -y libudunits2-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::reticulate, any::ggplot2
          needs: check

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Show what Quarto sees of Jupyter
        run: quarto check jupyter

      - uses: r-lib/actions/check-r-package@v2
        env:
          RETICULATE_PYTHON: ${{ env.pythonLocation }}/bin/python
          RETICULATE_USE_MANAGED_VENV: 'no'
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          error-on: '"error"'
