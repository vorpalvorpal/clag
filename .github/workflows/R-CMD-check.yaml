# R CMD check, with Python (numpy, pandas, a Jupyter kernel), Julia and Quarto
# set up so that the Python, Jupyter, Julia and Quarto tests run instead of
# skipping. One Ubuntu job on R release, to keep it cheap. The suite takes
# about 25-35 minutes.
# Based on check-standard in https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # jupyter_client and ipykernel let the Jupyter tests run, with a python3
      # kernel registered for the runner's user. Quarto's own jupyter.py also
      # needs pyyaml, nbformat and nbclient: without pyyaml every
      # `quarto render` of a notebook died with "No module named 'yaml'".
      - name: Install numpy, pandas and a Jupyter kernel
        run: |
          python -m pip install numpy pandas jupyter_client ipykernel pyyaml nbformat nbclient
          python -m ipykernel install --user

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Install udunits
        run: sudo apt-get update && sudo apt-get install -y libudunits2-dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::reticulate, any::ggplot2
          needs: check

      # R's own lib directory on LD_LIBRARY_PATH for the later steps, which
      # start Julia from R (needed for JuliaCall's set-up in the probes of
      # 13 Nov). The segfault of finding 22 was the system libunwind, which
      # weft now avoids itself by loading Julia's own before Julia starts.
      - name: Put R's lib directory on LD_LIBRARY_PATH for Julia
        run: echo "LD_LIBRARY_PATH=$(R RHOME)/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      # weft and the tests start Julia with install = FALSE, so JuliaCall's
      # Julia packages are added here, once, before the tests.
      - name: Install RCall and Suppressor for JuliaCall
        run: |
          export R_HOME="$(R RHOME)"
          julia -e 'using Pkg; Pkg.add(["Suppressor", "RCall"])'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Show what Quarto sees of Jupyter
        run: quarto check jupyter

      - uses: r-lib/actions/check-r-package@v2
        env:
          RETICULATE_PYTHON: ${{ env.pythonLocation }}/bin/python
          RETICULATE_USE_MANAGED_VENV: 'no'
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
          error-on: '"error"'
